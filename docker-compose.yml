# Artemis WMS — build-from-source stack (Portainer Git stack).
#
#   db     Postgres 16 with the non-superuser app role baked in
#   app    Spring Boot, built from ./app on the host
#   caddy  app-level HTTPS; parked behind the "edge" profile because the
#          shared edge Caddy on edge_net owns 80/443 for every stack
#
# Networks: artemis_net (private) + edge_net (shared, external).
# No registry pulls, no Watchtower, no unattended production restarts.

services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_DB: artemis
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      APP_DB_USER: ${DB_USER:-artemis_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - artemis_pgdata:/var/lib/postgresql/data
    networks: [artemis_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d artemis"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/artemis
      DB_USER: ${DB_USER:-artemis_app}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local-auth}
      BOOTSTRAP_SYSADMIN_EMAIL: ${BOOTSTRAP_SYSADMIN_EMAIL:-}
      BOOTSTRAP_SYSADMIN_PASSWORD: ${BOOTSTRAP_SYSADMIN_PASSWORD:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-mail.squiresenterprisesllc.com}
      MAIL_FROM: ${MAIL_FROM:-Artemis WMS <artemis@mail.squiresenterprisesllc.com>}
      REPLEN_AUTO: ${REPLEN_AUTO:-true}
      REPLEN_SCAN_MS: ${REPLEN_SCAN_MS:-60000}
    ports:
      - "${APP_PORT:-8085}:8080"     # LAN access without going through the edge
    networks: [artemis_net, edge_net]

  caddy:
    build: ./caddy
    restart: unless-stopped
    profiles: ["edge"]
    environment:
      WMS_DOMAIN: ${WMS_DOMAIN:-wms.squiresenterprisesllc.com}
    depends_on: [app]
    volumes:
      - artemis_caddy_data:/data
      - artemis_caddy_config:/config
    networks: [artemis_net, edge_net]

networks:
  artemis_net:
  edge_net:
    external: true

volumes:
  artemis_pgdata:
  artemis_caddy_data:
  artemis_caddy_config:
