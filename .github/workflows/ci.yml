name: build-and-publish
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test (Flyway runs against service Postgres)
        working-directory: app
        env:
          DB_URL: jdbc:postgresql://localhost:5432/wms
        run: mvn -B package
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/artemis-wms:latest
            ghcr.io/${{ github.repository_owner }}/artemis-wms:${{ github.sha }}
