name: build-and-test
on:
  push:
    branches: [main]
  pull_request:

# No registry push. The image is built on the Docker host by Portainer
# straight from this repo, same as the other stacks — so CI's job here is
# purely to tell you a push is broken before you redeploy.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wms
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wms" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build & test (Flyway runs against service Postgres)
        working-directory: app
        env:
          DB_URL: jdbc:postgresql://localhost:5432/wms
        run: mvn -B package
      - name: Verify the runtime image builds
        run: docker build -t artemis-wms:ci ./app
