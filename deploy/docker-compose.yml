# Artemis WMS — LAN-only tinker stack (Portainer Git stack, build from source)
# No Caddy, no Watchtower, no public exposure: the app binds to the NAS's
# LAN address only. Rebuild = Portainer "Pull and redeploy".
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - artemis_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d wms"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app            # adjust if the Dockerfile lives at repo root
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/wms
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: local-auth   # LAN sandbox: no IdP, use admin@artemis.local
    ports:
      - "192.168.1.5:8085:8080"            # LAN interface only — not reachable from outside
    networks:
      - artemis_net

networks:
  artemis_net:

volumes:
  pgdata:
