<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="|${site.code} receiving — Artemis WMS|"></title></head>
<body><main>
  <h1><span th:text="${site.name}">Site</span><small>receiving</small></h1>
  <div class="subnav"><a th:href="@{/sites/{s}/receiving(s=${site.org_node_id}, open=true)}" th:classappend="${open} ? 'on'">Open</a><a th:href="@{/sites/{s}/receiving(s=${site.org_node_id}, open=false)}" th:classappend="${!open} ? 'on'">All</a></div>
  <div class="grid c2">
    <div class="panel">
      <table><tr><th>Manifest</th><th>Carrier</th><th>Expected</th><th>Status</th><th class="num">Received / expected</th><th class="num">%</th></tr>
        <tr th:each="m : ${manifests}"><td><a th:href="@{/receiving/{id}(id=${m.manifest_id})}" class="loc" th:text="${m.manifest_number}"></a></td><td th:text="${m.carrier}"></td><td th:text="${m.expected_date}"></td>
          <td><span class="status" th:classappend="${m.status}" th:text="${m.status}"></span></td><td class="num" th:text="|${m.received_qty ?: 0} / ${m.expected_qty ?: 0}|"></td><td class="num" th:text="${m.pct_complete ?: 0}"></td></tr></table>
      <p class="empty" th:if="${#lists.isEmpty(manifests)}">No manifests.</p>
    </div>
    <div class="panel">
      <h2>New manifest</h2>
      <form th:action="@{/ui/sites/{s}/manifests(s=${site.org_node_id})}" method="post">
        <div class="row"><label>Manifest #<input name="manifestNumber" required></label><label>Carrier<input name="carrier"></label><label>Trailer<input name="trailer"></label><label>Expected<input name="expectedDate" type="date"></label></div>
        <label>Lines — one per row: <code>SKU qty</code><textarea name="lines" rows="5" class="mono" placeholder="DRY-1001 100&#10;CHL-2001 96"></textarea></label>
        <button type="submit" style="margin-top:.6rem">Create</button>
      </form>
    </div>
  </div>
</main></body></html>
