<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Artemis · Pallets</title><th:block th:replace="~{fragments :: headcss}"/></head>
<body>
<div th:replace="~{fragments :: topbar('assets')}"></div>
<div class="apage">
  <div class="crumbtrail"><a th:href="@{/assets(siteId=${siteId})}">ASSETS</a><span class="sep">›</span><a>PALLETS</a></div>
  <div class="ahead"><span class="eyebrow">Assets</span><h1>Pallets</h1></div>
  <form method="get" th:action="@{/assets/pallets}" class="inlineform" style="margin-bottom:16px">
    <input type="hidden" name="siteId" th:value="${siteId}">
    <input name="q" th:value="${q}" placeholder="LPN or prefix…" class="filterinput" style="min-width:240px" autofocus>
    <button class="btn">Look Up</button>
  </form>
  <div class="panel">
    <div class="panel-h"><h3>Pallets</h3><span class="eyebrow" th:text="${#lists.size(pallets)} + ' shown · newest first'">n</span></div>
    <table><thead><tr><th>LPN</th><th>SKU</th><th>Lot</th><th>Expires</th><th class="num">Avail</th><th class="num">Original</th><th>Location</th><th>Manifest</th><th>Status</th></tr></thead>
      <tbody><tr th:each="h : ${pallets}">
        <td><a class="linkcode" th:href="@{'/assets/pallets/' + ${h.inventory_id}(siteId=${siteId})}" th:text="${h.lpn}">L</a></td>
        <td><a class="linkcode" th:href="@{'/assets/items/' + ${h.item_id}(siteId=${siteId})}" th:text="${h.sku}">S</a></td>
        <td><a class="linkcode" th:if="${h.lot_number}" th:href="@{'/assets/lots/' + ${h.item_id} + '/' + ${h.lot_number}(siteId=${siteId})}" th:text="${h.lot_number}">l</a><span th:unless="${h.lot_number}">—</span></td>
        <td class="mono" th:text="${h.expiration_date ?: '—'}">-</td>
        <td class="num" th:text="${#numbers.formatDecimal(h.qty,1,0)}">0</td>
        <td class="num" th:text="${h.original_qty != null} ? ${#numbers.formatDecimal(h.original_qty,1,0)} : '—'">0</td>
        <td><span class="placard" th:if="${h.location_code}" th:classappend="${h.css}">
            <span class="tag" th:text="${h.loc_type == 'RECEIVING_DOCK'} ? 'DCK' : (${h.loc_type == 'CROSS_DOCK'} ? 'XDK' : (${h.loc_type == 'DROP'} ? 'DRP' : ${h.tag}))">T</span>
            <span class="code" th:text="${h.location_code}">L</span></span>
            <span th:unless="${h.location_code}" style="color:var(--ink-soft)" th:text="${h.status == 'PICKED'} ? 'on equipment' : '—'">—</span></td>
        <td><a class="linkcode" th:if="${h.manifest_id}" th:href="@{'/receiving/' + ${h.manifest_id}(siteId=${siteId})}" th:text="${h.manifest_number}">M</a><span th:unless="${h.manifest_id}">—</span></td>
        <td><span class="pill" th:classappend="${h.status == 'AVAILABLE'} ? 'on'" th:text="${h.status}">A</span></td>
      </tr>
      <tr th:if="${#lists.isEmpty(pallets)}"><td colspan="9" style="color:var(--ink-soft)">No pallets match.</td></tr>
      </tbody></table>
  </div>
</div>
</body></html>
