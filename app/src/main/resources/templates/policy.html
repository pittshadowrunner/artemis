<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="|${node.code} policy — Artemis WMS|"></title></head>
<body><main>
  <h1><span th:text="${node.code}">Node</span><small th:text="|${node.level} · inventory control policy|"></small></h1>
  <div class="subnav"><a th:href="@{/org}">← Organization</a></div>
  <div class="grid c2">
    <div class="panel"><h2>Declared here</h2>
      <form th:action="@{/ui/org/{id}/policy(id=${node.org_node_id})}" method="post">
        <div class="row">
          <label>Rotation<select name="rotation"><option value="">(inherit)</option><option th:each="r : ${ {'FEFO','FIFO','LIFO','NONE'} }" th:value="${r}" th:selected="${declared['rotation'] == r}" th:text="${r}"></option></select></label>
          <label>Min shelf life at receipt (days)<input name="minShelfLifeReceiptDays" type="number" th:value="${declared['min_shelf_life_receipt_days']}"></label>
          <label>Min shelf life to ship (days)<input name="minShelfLifeShipDays" type="number" th:value="${declared['min_shelf_life_ship_days']}"></label>
          <label>Expiry alert (days)<input name="expiryAlertDays" type="number" th:value="${declared['expiry_alert_days']}"></label>
        </div>
        <div class="row">
          <label>Allow lot mixing<select name="allowLotMixing"><option value="">(inherit)</option><option value="true" th:selected="${declared['allow_lot_mixing'] == true}">yes</option><option value="false" th:selected="${declared['allow_lot_mixing'] == false}">no</option></select></label>
          <label>Allow item mixing<select name="allowItemMixing"><option value="">(inherit)</option><option value="true" th:selected="${declared['allow_item_mixing'] == true}">yes</option><option value="false" th:selected="${declared['allow_item_mixing'] == false}">no</option></select></label>
          <label>Catch-weight tolerance %<input name="catchWeightTolerancePct" type="number" step="0.01" th:value="${declared['catch_weight_tolerance_pct']}"></label>
          <label>Require lot capture<select name="requireLotCapture"><option value="">(inherit)</option><option value="true" th:selected="${declared['require_lot_capture'] == true}">yes</option><option value="false" th:selected="${declared['require_lot_capture'] == false}">no</option></select></label>
        </div>
        <button type="submit">Save</button>
      </form></div>
    <div class="panel"><h2>Effective (after cascade)</h2>
      <table><tr th:each="e : ${effective}" th:if="${e.key != 'corporation_id' and e.key != 'org_node_id'}"><th th:text="${e.key}"></th><td th:text="${e.value ?: '—'}"></td></tr></table></div>
  </div>
</main></body></html>
