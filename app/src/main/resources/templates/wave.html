<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="|${wave.wave_number} — Artemis WMS|"></title></head>
<body><main>
  <div class="crumbs"><a th:href="@{/sites/{s}/waves(s=${site.org_node_id})}">Waves</a> › <b th:text="${wave.wave_number}">W</b></div>
  <h1><span th:text="${wave.wave_number}">W</span><small th:text="|${fmt.words(wave.wave_type)} wave · ${site.code}|"></small> <th:block th:replace="~{x :: zone(${wave.temp_zone})}"/> <th:block th:replace="~{x :: st(${wave.status})}"/></h1>
  <div class="subnav" th:if="${wave.status == 'PLANNED'}">
    <form th:action="@{/ui/waves/{id}/release(id=${wave.wave_id})}" method="post" class="inline">
      <select name="equipment" aria-label="Equipment"><option value="" th:text="|No unit yet — batches of ${wave.batch_size}|">No unit</option><option th:each="e : ${equipment}" th:if="${e.container_positions != null}" th:value="${e.code}" th:text="|${e.code} · ${e.container_positions} positions|"></option></select>
      <select name="build" aria-label="How assignments are built"><option value="AUTO">Cut assignments now</option><option value="MANUAL">Leave on the board — build by hand or on request</option></select>
      <button type="submit">Release — allocate</button></form>
  </div>
  <div class="grid c2">
    <div class="panel"><h2>Zone orders</h2>
      <table><tr><th>Zone order</th><th>Customer</th><th>Ship date</th><th>Route / stop</th><th>Assignment</th><th class="num">Pos</th><th>Dropped</th></tr>
        <tr th:each="z : ${wave.zoneOrders}"><td><th:block th:replace="~{x :: order(${z.order_number})}"/><span class="mono muted" th:text="|-${go.tag(wave.temp_zone)}|"></span> <span class="pri p9" th:if="${z.rush}">RUSH</span></td>
          <td><th:block th:replace="~{x :: customer(${z.customer}, ${z.customer_name})}"/></td><td th:text="${z.requested_ship_date}"></td><td class="small" th:text="|${z.route_code ?: ''} ${z.stop_sequence != null ? '#' + z.stop_sequence : ''}|"></td>
          <td><th:block th:replace="~{x :: asg(${z.assignment_number})}"/></td><td class="num" th:text="${z.cart_position}"></td>
          <td class="small"><th:block th:if="${z.dropped_at}"><th:block th:replace="~{x :: slot(${z.drop_location})}"/> <span class="muted" th:text="${fmt.dt(z.dropped_at, 'HH:mm')}"></span></th:block></td></tr></table></div>
    <div class="panel"><h2>Assignments</h2>
      <table th:if="${!#lists.isEmpty(wave.assignments)}"><tr><th>Assignment</th><th>Status</th><th>Priority</th><th>Unit</th><th>Operator</th><th class="num">Picks</th></tr>
        <tr th:each="a : ${wave.assignments}"><td><th:block th:replace="~{x :: asg(${a.assignment_number})}"/></td><td><th:block th:replace="~{x :: st(${a.status})}"/></td><td><th:block th:replace="~{x :: pri(${a.priority})}"/></td>
          <td><th:block th:replace="~{x :: unit(${a.equipment})}"/></td><td><th:block th:replace="~{x :: op(${a.operator_id}, ${a.assigned_to})}"/></td><td class="num" th:text="|${a.done}/${a.tasks}|"></td></tr></table>
      <p class="empty" th:if="${#lists.isEmpty(wave.assignments)}" th:text="${wave.status == 'PLANNED' ? 'Planned — releasing the wave allocates stock and cuts the assignments.' : 'No assignments were cut — nothing could be allocated.'}">Not released yet.</p></div>
  </div>
</main></body></html>
