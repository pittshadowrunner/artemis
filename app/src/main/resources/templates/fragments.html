<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<th:block th:fragment="headcss">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--concrete:#F2F3F1;--ink:#1C2126;--ink-soft:#4A5158;--line:#D8DBD6;--amber:#FFB100;--amber-ink:#5C3D00;--frozen:#4A90D9;--chill:#43A89B;--card:#FFFFFF;--danger:#D9534A;--ok:#4E9A51}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Public Sans',sans-serif;background:var(--concrete);color:var(--ink);font-size:14px}
.eyebrow{font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:12px;color:var(--ink-soft)}
h1,h2,h3{font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.04em}
.mono{font-family:'IBM Plex Mono',monospace}
.topbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:24px;padding:0 24px;height:56px}
.brand{font-family:'Saira Condensed';font-weight:700;font-size:20px;letter-spacing:.08em;color:#fff;text-decoration:none}
.brand b{color:var(--amber)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px}
.crumbs .lvl{padding:4px 10px;border:1px solid #3A424A;border-radius:3px;color:#C7CCD1}
.crumbs .lvl.active{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);font-weight:600}
.crumbs .sep{color:#5A626B}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#C7CCD1}
.role-chip{background:#2A3138;border:1px solid #3A424A;border-radius:3px;padding:3px 8px;font-family:'IBM Plex Mono';font-size:11px;color:var(--amber)}
.navlink{color:#C7CCD1;text-decoration:none;font-size:13px;padding:4px 10px;border:1px solid #3A424A;border-radius:3px}
.navlink:hover{color:#fff;border-color:#5A626B}
.panel{background:var(--card);border:1px solid var(--line);margin-bottom:20px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--ink-soft);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
td{padding:11px 16px;border-bottom:1px solid #ECEEEA;vertical-align:middle}
td.num,th.num{font-family:'IBM Plex Mono';text-align:right}
tr:hover td{background:#FAFAF8}
.placard{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;font-family:'IBM Plex Mono';font-weight:600;font-size:12px;line-height:1}
.placard .tag{background:var(--amber);color:var(--amber-ink);padding:5px 6px;font-size:10px;display:flex;align-items:center}
.placard .code{background:#fff;padding:5px 8px;letter-spacing:.05em}
.placard.frozen .tag{background:var(--frozen);color:#fff}
.placard.chill .tag{background:var(--chill);color:#fff}
.type-chip{font-family:'IBM Plex Mono';font-size:11px;padding:3px 7px;border-radius:2px;background:#EEF0EC;border:1px solid var(--line)}
.status{font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;padding:3px 8px;border-radius:2px}
.status.progress{background:#FFF3D6;color:var(--amber-ink)}
.status.open{background:#EEF0EC;color:var(--ink-soft)}
.check{color:var(--ink-soft);font-size:11px}
.check b{font-family:'IBM Plex Mono';color:var(--ink)}
.bar{height:8px;background:#EEF0EC;border-radius:2px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ink)}
.bar i.done{background:var(--ok)}
footer{padding:0 24px 28px;font-size:12px;color:var(--ink-soft)}
/* asset design system: every asset screen = crumbtrail + head + attrs + children */
.apage{padding:20px 24px;max-width:1200px}
.crumbtrail{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:14px}
.crumbtrail a{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);text-decoration:none;padding:3px 8px;border:1px solid var(--line);border-radius:2px;background:#fff}
.crumbtrail a:hover{border-color:var(--ink);color:var(--ink)}
.crumbtrail .sep{color:var(--line)}
.ahead{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ahead .eyebrow{font-size:12px}
.ahead h1{font-size:26px}
.ahead .digits{font-family:'IBM Plex Mono';font-size:13px;background:var(--ink);color:var(--amber);padding:4px 10px;border-radius:2px}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:20px}
.attr{background:var(--card);padding:10px 12px}
.attr .k{font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--ink-soft)}
.attr .v{font-family:'IBM Plex Mono';font-size:13px;margin-top:3px;word-break:break-word}
.attr .v.big{font-size:18px;font-weight:600}
a.rowlink{color:inherit;text-decoration:none;display:contents}
td a{color:inherit;text-decoration:none}
td a:hover .code, tr:hover td a{text-decoration:none}
.linkcode{font-family:'IBM Plex Mono';font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--amber)}
.linkcode:hover{background:#FFF3D6}
.vel{font-family:'Saira Condensed';font-weight:700;font-size:16px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:2px}
.vel.A{background:var(--amber);color:var(--amber-ink)}
.vel.B{background:#EEF0EC}
.vel.C{background:#fff;color:var(--ink-soft)}
.pill{font-family:'IBM Plex Mono';font-size:11px;padding:2px 8px;border-radius:2px;border:1px solid var(--line)}
.pill.on{background:#E7F0EE;color:#2C6B60;border-color:#BFD9D3}
.pill.off{background:#FDEBE9;color:var(--danger);border-color:#F2C4C0}
/* pick-line graph */
.plgraph{padding:16px}
.plrow{display:grid;grid-template-columns:44px 130px 1fr 60px;gap:10px;align-items:center;margin-bottom:8px}
.plrow .seqno{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft)}
.plbar{height:20px;background:#EEF0EC;border-radius:2px;overflow:hidden;position:relative}
.plbar i{display:block;height:100%}
.plbar i.done{background:var(--ok)}
.plbar i.open{background:repeating-linear-gradient(-45deg,var(--amber) 0 8px,#E8A700 8px 16px)}
.plbar span{position:absolute;left:8px;top:0;line-height:20px;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink)}
/* forms + actions */
.flash{background:#E7F0EE;border:1px solid #BFD9D3;color:#2C6B60;padding:10px 16px;margin-bottom:16px;font-size:13px}
.flash.err{background:#FDEBE9;border-color:#F2C4C0;color:var(--danger)}
details.editbox{background:var(--card);border:1px solid var(--line);margin-bottom:20px}
details.editbox summary{cursor:pointer;padding:12px 16px;font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--ink-soft);user-select:none}
details.editbox[open] summary{border-bottom:1px solid var(--line);color:var(--ink)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:16px}
.field label{display:block;font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select{width:100%;font-family:'IBM Plex Mono';font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:2px;background:#fff}
.field input:focus,.field select:focus{outline:2px solid var(--amber);border-color:var(--amber)}
.formfoot{padding:0 16px 16px}
.btn{font-family:'Saira Condensed';text-transform:uppercase;letter-spacing:.1em;font-weight:600;font-size:13px;background:var(--ink);color:var(--amber);border:none;border-radius:2px;padding:9px 18px;cursor:pointer}
.btn:hover{background:#2A3138}
.btn.secondary{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.inlineform{display:flex;gap:8px;align-items:center}
.inlineform input,.inlineform select{font-family:'IBM Plex Mono';font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:2px}
/* lifecycle badges */
.status.pending{background:#EEF0EC;color:var(--ink-soft)}
.status.assigned{background:#E3ECF6;color:#2C4E75}
.status.reassigned{background:#F0E6F6;color:#5C3A75}
.status.inprogress{background:#FFF3D6;color:var(--amber-ink)}
.status.complete{background:#E7F0EE;color:#2C6B60}
.status.cancelled{background:#FDEBE9;color:var(--danger)}
/* clickable lanes */
a.lane{display:block;text-decoration:none;color:inherit}
a.lane:hover{border-top-color:var(--amber)}
a.lane.active{border-top-color:var(--amber);background:#FFFBF0;outline:1.5px solid var(--amber)}
a.lane.active .eyebrow{color:var(--amber-ink)}
/* in-panel filter */
.filterinput{font-family:'IBM Plex Mono';font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:2px;min-width:180px}
.filterinput:focus{outline:2px solid var(--amber);border-color:var(--amber)}
</style>
</th:block>
<body>
<th:block th:fragment="filterbox">
  <input class="filterinput" type="search" placeholder="Filter…" oninput="__flt(this)">
  <script>function __flt(inp){var t=inp.value.toLowerCase();
    var scope=inp.closest('.panel')||document;
    scope.querySelectorAll('tbody tr, .plrow').forEach(function(r){
      r.style.display=r.textContent.toLowerCase().indexOf(t)>=0?'':'none';});}</script>
</th:block>
<div th:fragment="flashbar" th:remove="tag">
  <div class="flash" th:if="${flash}" th:text="${flash}">ok</div>
  <div class="flash err" th:if="${flashError}" th:text="${flashError}">err</div>
</div>
<div th:fragment="topbar(active)" class="topbar">
  <a class="brand" th:href="@{/(siteId=${siteId})}">ARTE<b>MIS</b></a>
  <nav class="crumbs" aria-label="Organization" th:if="${crumb != null}">
    <span class="lvl" th:if="${crumb['CORPORATION']}" th:text="${crumb['CORPORATION'].code}">CORP</span>
    <span class="sep" th:if="${crumb['DISTRICT_REGION']}">›</span>
    <span class="lvl" th:if="${crumb['DISTRICT_REGION']}" th:text="${crumb['DISTRICT_REGION'].code}">REGION</span>
    <span class="sep">›</span>
    <span class="lvl active" th:text="${crumb['SITE_LOCATION'].code + ' · ' + #strings.toUpperCase(crumb['SITE_LOCATION'].name)}">SITE</span>
  </nav>
  <a class="navlink" th:href="@{/(siteId=${siteId})}" th:classappend="${active=='ops'} ? 'active'">Operations</a>
  <a class="navlink" th:href="@{/metrics(siteId=${siteId})}" th:classappend="${active=='metrics'} ? 'active'">Metrics</a>
  <a class="navlink" th:href="@{/orders(siteId=${siteId})}" th:classappend="${active=='orders'} ? 'active'">Orders</a>
  <a class="navlink" th:href="@{/waves(siteId=${siteId})}" th:classappend="${active=='waves'} ? 'active'">Waves</a>
  <a class="navlink" th:href="@{/operators(siteId=${siteId})}" th:classappend="${active=='operators'} ? 'active'">Operators</a>
  <a class="navlink" th:href="@{/assets(siteId=${siteId})}" th:classappend="${active=='assets'} ? 'active'">Assets</a>
  <a class="navlink" href="/api-docs/ui" target="_blank">API</a>
  <div class="user">
    <span class="role-chip" th:text="${sysadmin} ? 'SYSADMIN' : 'ADMIN'">ADMIN</span>
    <span th:text="${userEmail}">user</span>
  </div>
</div>
</body>
</html>
