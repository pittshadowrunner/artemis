<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title>Customers — Artemis WMS</title></head>
<body><main>
  <h1>Customers<small th:text="|${#lists.size(customers)} shown|"></small></h1>
  <form th:action="@{/customers}" method="get" class="inline" style="margin-bottom:1rem"><input name="q" th:value="${q}" placeholder="code or name" autofocus><button type="submit" class="secondary">Filter</button></form>
  <div class="panel"><table><tr><th>Customer</th><th>Code</th><th>City</th><th>Route / stop</th><th class="num">Min shelf life</th><th>Carrier</th></tr>
    <tr th:each="c : ${customers}"><td><th:block th:replace="~{x :: customer(${c.code}, ${c.name})}"/></td><td class="mono small" th:text="${c.code}"></td><td th:text="|${c.city ?: ''}${c.state_province != null ? ', ' + c.state_province : ''}|"></td><td th:text="|${c.route_code ?: ''} ${c.stop_sequence != null ? '#' + c.stop_sequence : ''}|"></td><td class="num" th:text="${c.min_shelf_life_days != null ? c.min_shelf_life_days + ' days' : '—'}"></td><td th:text="${c.preferred_carrier ?: ''}"></td></tr></table>
    <p class="empty" th:if="${#lists.isEmpty(customers)}">No customers.</p></div>
</main></body></html>
