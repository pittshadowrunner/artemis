<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="|${order.order_number} — Artemis WMS|"></title></head>
<body><main>
  <h1><span th:text="${order.order_number}">ORD</span><small th:text="|${order.customer_name} · ${site.code}|"></small> <span class="status" th:classappend="${order.status}" th:text="${order.status}"></span> <span class="pri p9" th:if="${order.rush}">RUSH</span></h1>
  <div class="subnav"><a th:href="@{/sites/{s}/orders(s=${site.org_node_id})}">← Orders</a></div>
  <div class="grid c2">
    <div class="panel"><h2>Lines &amp; allocations</h2>
      <table><tr><th>#</th><th>SKU</th><th class="num">Ordered</th><th class="num">Alloc</th><th class="num">Picked</th><th>From</th></tr>
        <tr th:each="l : ${order.lines}"><td th:text="${l.line_number}"></td><td><span class="loc" th:text="${l.sku}"></span> <span class="tag" th:classappend="${#strings.toLowerCase(l.temp_zone) == 'frozen'} ? 'frozen' : (${#strings.toLowerCase(l.temp_zone) == 'refrigerated'} ? 'chill')" th:text="${l.temp_zone.substring(0,3)}"></span><br><span class="muted small" th:text="${l.description}"></span></td>
          <td class="num" th:text="${l.ordered_qty}"></td><td class="num" th:text="${l.allocated_qty}"></td><td class="num" th:text="${l.picked_qty}"></td>
          <td class="small"><div th:each="a : ${l.allocations}"><a th:href="@{/lpn(q=${a.lpn})}" class="mono" th:text="${a.lpn}"></a> @ <span class="loc" th:text="${a.location}"></span> × <span th:text="${a.qty}"></span> <span th:if="${a.lot}" th:text="|lot ${a.lot} exp ${a.expires}|" class="muted"></span> <b class="sev WARNING" th:if="${a.bypass}">BYPASS</b></div></td></tr></table></div>
    <div class="panel"><h2>Zone orders</h2>
      <table><tr><th>Zone</th><th>Wave</th><th>Assignment</th><th>Dropped</th></tr>
        <tr th:each="z : ${order.zoneOrders}"><td><span class="tag" th:classappend="${#strings.toLowerCase(z.temp_zone) == 'frozen'} ? 'frozen' : (${#strings.toLowerCase(z.temp_zone) == 'refrigerated'} ? 'chill')" th:text="${z.temp_zone}"></span></td><td th:text="${z.wave_number ?: '—'}"></td>
          <td><span th:text="${z.assignment_number ?: '—'}" class="mono"></span> <span class="status" th:if="${z.assignment_status}" th:classappend="${z.assignment_status}" th:text="${z.assignment_status}"></span></td>
          <td th:text="${z.dropped_at != null ? z.drop_location + ' ' + fmt.dt(z.dropped_at, 'MM-dd HH:mm') : '—'}"></td></tr></table></div>
  </div>
</main></body></html>
