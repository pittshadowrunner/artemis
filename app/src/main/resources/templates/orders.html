<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="|${site.code} orders — Artemis WMS|"></title></head>
<body><main>
  <h1><span th:text="${site.name}">Site</span><small>orders</small></h1>
  <div class="subnav"><a th:href="@{/sites/{s}/orders(s=${site.org_node_id})}" th:classappend="${status == null} ? 'on'">All</a>
    <a th:each="st : ${ {'NEW','ALLOCATED','PICKING','PICKED','DROPPED','SHIPPED'} }" th:href="@{/sites/{s}/orders(s=${site.org_node_id}, status=${st})}" th:classappend="${status == st} ? 'on'" th:text="${st}"></a></div>
  <div class="grid c2">
    <div class="panel" style="grid-column:span 1">
      <table><tr><th>Order</th><th>Customer</th><th>Ship</th><th>Zones</th><th>Status</th><th class="num">Lines</th><th class="num">Picked</th></tr>
        <tr th:each="o : ${orders}"><td><a th:href="@{/orders/{id}(id=${o.order_id})}" class="loc" th:text="${o.order_number}"></a> <span class="pri p9" th:if="${o.rush}">RUSH</span></td><td th:text="${o.customer_code}"></td><td th:text="${o.requested_ship_date}"></td>
          <td class="small" th:text="|${o.zones} (${o.zones_waved} waved, ${o.zones_dropped} dropped)|"></td><td><span class="status" th:classappend="${o.status}" th:text="${o.status}"></span></td><td class="num" th:text="${o.lines}"></td><td class="num" th:text="|${o.picked_qty}/${o.ordered_qty}|"></td></tr></table>
      <p class="empty" th:if="${#lists.isEmpty(orders)}">No orders.</p>
    </div>
    <div class="panel">
      <h2>New order</h2>
      <form th:action="@{/ui/sites/{s}/orders(s=${site.org_node_id})}" method="post">
        <div class="row"><label>Order #<input name="orderNumber" required></label>
          <label>Customer<select name="customer"><option th:each="c : ${customers}" th:value="${c.code}" th:text="|${c.code} — ${c.name}|"></option></select></label>
          <label>Ship date<input name="requestedShipDate" type="date"></label><label>Priority<input name="priority" type="number" min="1" max="10" value="5"></label></div>
        <label>Lines — <code>SKU qty</code> per row<textarea name="lines" rows="4" class="mono"></textarea></label>
        <label style="flex-direction:row;align-items:center;gap:.5rem;margin-top:.5rem"><input type="checkbox" name="rush" value="true"> Rush</label>
        <button type="submit" style="margin-top:.6rem">Create</button>
      </form>
    </div>
  </div>
</main></body></html>
