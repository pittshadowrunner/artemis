<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><title>Artemis · Orders</title><th:block th:replace="~{fragments :: headcss}"/></head>
<body>
<div th:replace="~{fragments :: topbar('orders')}"></div>
<div class="apage">
  <div th:replace="~{fragments :: flashbar}"></div>
  <div class="ahead"><span class="eyebrow">Demand</span><h1>Orders</h1></div>

  <form method="get" th:action="@{/orders}" class="inlineform" style="margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <input type="hidden" name="siteId" th:value="${siteId}">
    <input name="customer" th:value="${customer}" placeholder="Customer name or code…" class="filterinput" style="min-width:200px">
    <input type="date" name="from" th:value="${from}" class="filterinput">
    <input type="date" name="to" th:value="${to}" class="filterinput">
    <select name="status" class="filterinput">
      <option value="" th:selected="${status == ''}">Any status</option>
      <option th:each="st : ${ {'NEW','ALLOCATED','RELEASED','PICKING','PICKED','SHIPPED'} }"
              th:value="${st}" th:text="${st}" th:selected="${status == st}">S</option>
    </select>
    <button class="btn">Filter</button>
  </form>

  <div class="panel">
    <div class="panel-h"><h3>Orders</h3><span class="eyebrow">Waving lives on the Waves screen · assignment building on the Selection lane</span></div>
    <table><thead><tr><th>Order</th><th>Customer</th><th>Route</th><th class="num">Lines</th><th class="num">Ordered</th><th class="num">Picked</th><th>Created</th><th>Status</th></tr></thead>
      <tbody>
        <tr th:each="o : ${orders}">
          <td><a class="linkcode" style="font-weight:600" th:href="@{'/orders/' + ${o.order_id}(siteId=${siteId})}" th:text="${o.order_number}">O</a></td>
          <td><a class="linkcode" th:href="@{'/customers/' + ${o.customer_id}(siteId=${siteId})}" th:text="${o.customer_name} + ' (' + ${o.customer_code} + ')'">c</a></td>
          <td class="mono" th:text="${o.route_code ?: '—'}">r</td>
          <td class="num" th:text="${o.lines}">0</td>
          <td class="num" th:text="${#numbers.formatDecimal(o.ordered_qty,1,0)}">0</td>
          <td class="num" th:text="${#numbers.formatDecimal(o.picked_qty,1,0)}">0</td>
          <td class="mono" style="font-size:11px" th:text="${#dates.format(o.created_at,'MM-dd HH:mm')}">t</td>
          <td><span class="pill" th:classappend="${o.status == 'RELEASED' or o.status == 'ALLOCATED'} ? 'on'" th:text="${o.status}">S</span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(orders)}"><td colspan="8" style="color:var(--ink-soft)">No orders match the filter.</td></tr>
      </tbody></table>
  </div>

</div>
</body></html>
