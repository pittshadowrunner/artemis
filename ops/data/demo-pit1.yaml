      - { code: CART-02, type: CART, positions: 6 }
      - { code: PJ-01, type: PALLET_JACK }
      - { code: REACH-01, type: REACH_TRUCK, capabilities: [LIFT_HIGH, COLD_RATED] }
    containers:
      - { barcode: TOTE-0001, type: TOTE }
      - { barcode: TOTE-0002, type: TOTE }
      - { barcode: TOTE-0003, type: TOTE }
