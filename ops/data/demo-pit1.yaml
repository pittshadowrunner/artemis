sites:
  - site: PIT1
    locations:
      - { code: DOCK-R1, locType: RECEIVING_DOCK }
      - { code: DOCK-R2, locType: RECEIVING_DOCK }
      - { code: DOCK-S1, locType: SHIPPING_DOCK }
      - { code: DROP-01, locType: DROP }
      - { code: DROP-02, locType: DROP }
      - { code: STAGE-01, locType: STAGING }
      # pick faces: a STANDARD slot with replenSku set (the racks below keep these fields)
      - { code: D-A-1-01-A, replenSku: DRY-1001, replenMinQty: 10, replenTriggerQty: 20, replenMaxQty: 40 }
      - { code: D-A-1-02-A, replenSku: DRY-1002, replenMinQty: 10, replenTriggerQty: 20, replenMaxQty: 60 }
      - { code: C-A-1-03-A, tempZone: REFRIGERATED, replenSku: CHL-2001, replenMinQty: 12, replenTriggerQty: 24, replenMaxQty: 48 }
      - { code: F-A-1-03-A, tempZone: FROZEN, replenSku: FRZ-3001, replenMinQty: 8, replenTriggerQty: 16, replenMaxQty: 48 }
    racks:                                       # Zone-Aisle-Level-Column-Slot → sequence derived
      - { zone: D, aisles: [A, B], levels: 1-3, columns: 1-6, slots: [A, B], tempZone: AMBIENT, area: DRY, rackType: SELECTIVE }
      - { zone: C, aisles: [A], levels: 1-2, columns: 1-6, slots: [A, B], tempZone: REFRIGERATED, area: COOLER, rackType: SELECTIVE }
      - { zone: F, aisles: [A], levels: 1-2, columns: 1-6, slots: [A, B], tempZone: FROZEN, area: FREEZER, rackType: SELECTIVE }
