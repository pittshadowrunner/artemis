      - { lpn: PLT-0003, sku: DRY-1002, location: D-A-2-02-A, qty: 48 }
      - { lpn: PLT-0004, sku: DRY-1003, location: D-B-2-01-A, qty: 50 }
      - { lpn: PLT-0005, sku: DRY-1004, location: D-B-2-02-A, qty: 36 }
      - { lpn: PLT-0101, sku: CHL-2001, location: C-A-2-01-A, qty: 48, lot: L24091, expirationDate: today+15 }
      - { lpn: PLT-0102, sku: CHL-2001, location: C-A-2-02-A, qty: 48, lot: L24098, expirationDate: today+22 }
      - { lpn: PLT-0103, sku: CHL-2002, location: C-A-2-03-A, qty: 50, lot: CH-7781, expirationDate: today+81, actualWeightKg: 114.2 }
      - { lpn: PLT-0104, sku: CHL-2003, location: C-A-2-04-A, qty: 60, lot: GY-0402, expirationDate: today+40 }
      - { lpn: PLT-0201, sku: FRZ-3001, location: F-A-2-01-A, qty: 48, lot: CB-2210, expirationDate: today+220, actualWeightKg: 872.5 }
      - { lpn: PLT-0202, sku: FRZ-3002, location: F-A-2-02-A, qty: 42, expirationDate: today+400 }
      - { lpn: PLT-0203, sku: FRZ-3003, location: F-A-2-03-A, qty: 45, lot: IC-991, expirationDate: today+180 }
