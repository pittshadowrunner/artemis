# Demo dataset for PIT1 — dates are relative (today+N) so the file never ages out.
# — customers, items across three temp zones, racking,
# docks, equipment, opening balances and an inbound manifest. Apply after
# hierarchy.example.yaml. Re-applying is safe.
corporation: { code: SQE, name: Squires Enterprises LLC }

customers:
  - { code: GIANT-EAGLE-012, name: 'Giant Eagle #012', city: Canonsburg, stateProvince: PA, routeCode: R1, stopSequence: 1, minShelfLifeDays: 10 }
