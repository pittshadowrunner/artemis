      - { lpn: PF-0001, sku: DRY-1001, location: D-A-1-01-A, qty: 12 }
      - { lpn: PF-0002, sku: DRY-1002, location: D-A-1-02-A, qty: 40 }
      - { lpn: PF-0101, sku: CHL-2001, location: C-A-1-03-A, qty: 30, lot: L24085, expirationDate: today+8 }
      - { lpn: PF-0201, sku: FRZ-3001, location: F-A-1-03-A, qty: 20, lot: CB-2200, expirationDate: today+190, actualWeightKg: 363.0 }
